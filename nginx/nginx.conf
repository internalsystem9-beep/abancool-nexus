# Main Nginx configuration for ABANCOOL API
# Production-grade setup with SSL, compression, caching, and security headers

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Logging format
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time uct="$upstream_connect_time" '
                  'uht="$upstream_header_time" urt="$upstream_response_time"';

  access_log /var/log/nginx/access.log main buffer=32k;

  # Performance optimizations
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 10M;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml text/javascript 
             application/x-javascript application/xml+rss 
             application/javascript application/json;
  gzip_disable "msie6";
  gzip_comp_level 6;

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;

  # Upstream API server
  upstream api_backend {
    least_conn;
    
    # Primary API instance
    server api:4000 max_fails=3 fail_timeout=30s weight=1;
    
    # Fallback (can add more instances for load balancing)
    # server api2:4000 max_fails=3 fail_timeout=30s weight=1;
    # server api3:4000 max_fails=3 fail_timeout=30s weight=1;
    
    keepalive 64;
  }

  # Cache zones
  proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=60m;
  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zones=static_cache:100m max_size=5g inactive=30d;

  # SSL configuration
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_stapling on;
  ssl_stapling_verify on;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # HTTP redirect to HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # HTTPS server
  server {
    listen 443 ssl http2;
    server_name api.abancool.com;

    # SSL certificates
    ssl_certificate /etc/nginx/ssl/abancool.crt;
    ssl_certificate_key /etc/nginx/ssl/abancool.key;

    # Logging
    access_log /var/log/nginx/api_access.log main;
    error_log /var/log/nginx/api_error.log warn;

    # API routes
    location /api/ {
      # Rate limiting
      limit_req zone=api_limit burst=10 nodelay;
      limit_req_status 429;

      # Proxy settings
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Request-ID $request_id;

      # Timeouts
      proxy_connect_timeout 30s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;

      # Buffering
      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;
      proxy_busy_buffers_size 8k;

      # Disable caching for API responses
      proxy_no_cache 1;
      proxy_cache_bypass 1;

      # Custom error pages
      error_page 502 503 504 /50x.json;
    }

    # Authentication endpoints (stricter rate limit)
    location /api/auth/ {
      limit_req zone=auth_limit burst=2 nodelay;
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Upload endpoints
    location /api/files/upload {
      limit_req zone=upload_limit burst=5 nodelay;
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      
      # Disable buffering for uploads
      proxy_request_buffering off;
      proxy_buffering off;
    }

    # Static assets with caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
      proxy_pass http://api_backend;
      proxy_cache static_cache;
      proxy_cache_valid 200 30d;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      add_header Cache-Control "public, max-age=2592000";
      add_header X-Cache-Status $upstream_cache_status;
    }

    # Health check endpoint
    location /api/health {
      access_log off;
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # API documentation
    location /api-docs {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }

    # Block direct access to sensitive files
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }

    # Error pages
    error_page 50x /50x.json;
    location = /50x.json {
      internal;
      default_type application/json;
      return 500 '{"success":false,"error":"Internal Server Error","errorCode":"INTERNAL_SERVER_ERROR","timestamp":"'$(date -u +'%Y-%m-%dT%H:%M:%SZ')'"}';
    }
  }
}
